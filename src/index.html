<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cosmos DB NoSQL</title>
    <style>
      /* STYLE */
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="orbit">◉</span>
        <div>
          <strong>Cosmos DB <span class="muted">/ NoSQL</span></strong
          ><small id="connection-name"
            >从 DBX 打开已保存的 Cosmos DB 连接</small
          >
        </div>
      </div>
      <span id="mode" class="badge">未连接</span>
    </header>
    <div class="workspace">
      <aside>
        <div class="section-title">
          数据库与容器 <button id="refresh" title="刷新数据库列表">↻</button>
        </div>
        <label
          >数据库<select id="database" aria-label="数据库">
            <option value="">选择数据库</option>
          </select></label
        ><label
          >容器<select id="container" aria-label="容器">
            <option value="">选择容器</option>
          </select></label
        >
        <div id="container-info" class="info">连接后选择容器开始查询。</div>
        <details>
          <summary>容器元数据</summary>
          <pre id="metadata">—</pre>
        </details>
        <div class="aside-note">
          查询按页读取。RU 与耗时为当前页；导出仅包含当前页。
        </div>
      </aside>
      <main>
        <section class="query-panel">
          <div class="section-title query-heading">
            <span>SQL 查询</span>
            <div class="toolbar">
              <span class="muted shortcut">⌘ / Ctrl + Enter 运行</span>
              <button
                id="query-collapse"
                type="button"
                class="compact"
                aria-expanded="true"
                aria-controls="query-body"
              >
                收起 SQL
              </button>
              <button
                id="run-collapsed"
                type="button"
                class="primary compact"
                hidden
              >
                运行查询
              </button>
              <button id="cancel-query" type="button" hidden>取消查询</button>
              <button
                id="sql-search"
                type="button"
                class="icon-button"
                aria-label="搜索 SQL"
                title="搜索 SQL（⌘ / Ctrl + F）"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="10.5" cy="10.5" r="6.5" />
                  <path d="m16 16 4.5 4.5" />
                </svg>
              </button>
            </div>
          </div>
          <div id="query-body">
            <div id="sql" class="code-editor"></div>
            <button
              id="sql-diagnostic"
              class="sql-diagnostic"
              type="button"
              hidden
            ></button>
            <div class="query-options">
              <label
                >每页<select id="page-size" aria-label="每页条数">
                  <option>25</option>
                  <option selected>100</option>
                  <option>250</option>
                  <option>1000</option>
                </select></label
              ><label class="grow"
                ><span
                  >分区键 <span class="label-hint">可选 · JSON 数组</span></span
                ><span class="pk-input"
                  ><input
                    id="query-pk"
                    placeholder='["tenant-a"] 或留空跨分区'
                    spellcheck="false"
                  /><button
                    id="query-pk-choose"
                    type="button"
                    aria-label="选择查询分区键"
                    aria-expanded="false"
                    aria-controls="pk-picker"
                  >
                    选择 ▾
                  </button></span
                ></label
              ><button id="run" class="primary">运行查询</button>
            </div>
            <details>
              <summary>查询参数</summary>
              <textarea
                id="parameters"
                aria-label="查询参数"
                spellcheck="false"
                placeholder='[{"name":"@id","value":"example"}]'
              >
[]</textarea
              >
            </details>
          </div>
        </section>
        <div id="status" role="status" aria-live="polite">等待连接</div>
        <section class="results-panel">
          <div class="section-title">
            <div class="result-heading">
              查询结果 <span id="row-count" class="muted">0 条</span
              ><span id="query-metrics" class="muted"></span
              ><span id="execution-source" class="muted" hidden></span
              ><span id="result-origin" class="muted" hidden></span>
            </div>
            <div class="toolbar">
              <div class="segmented" role="group" aria-label="查询结果视图">
                <button id="table-view" class="active" aria-pressed="true">
                  表格
                </button>
                <button id="json-view" aria-pressed="false">JSON</button>
              </div>
              <button id="export">导出当前页</button>
              <button id="document-toggle" type="button" aria-expanded="true">
                收起文档
              </button>
            </div>
          </div>
          <div class="result-tools">
            <div class="result-filter">
              <input
                type="search"
                id="result-filter"
                aria-label="筛选当前页"
                placeholder="筛选当前页（不查询数据库）"
              /><button
                id="clear-filter"
                type="button"
                aria-label="清除结果筛选"
                hidden
              >
                ×
              </button>
            </div>
            <div id="table-tools" class="toolbar">
              <button id="copy-cell" type="button" disabled>复制单元格</button>
              <button id="copy-row" type="button" disabled>复制行 JSON</button>
            </div>
            <div id="result-json-tools" class="toolbar" hidden>
              <button
                id="result-json-search"
                type="button"
                class="icon-button"
                aria-label="搜索查询结果"
                title="搜索当前页 JSON（⌘ / Ctrl + F）"
                disabled
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="10.5" cy="10.5" r="6.5" />
                  <path d="m16 16 4.5 4.5" />
                </svg>
              </button>
              <button id="copy-results-json" type="button" disabled>
                复制 JSON
              </button>
            </div>
            <div class="toolbar pagination" aria-label="查询结果分页">
              <button id="previous">上一页</button>
              <span id="page-label">第 0 页</span>
              <button id="next">下一页</button>
            </div>
          </div>
          <div id="table" class="table-scroll">
            <div class="empty">选择容器后运行查询</div>
          </div>
          <div id="raw-results" class="code-editor" hidden></div>
        </section>
      </main>
      <div
        id="document-resize"
        role="separator"
        aria-label="调整文档面板宽度"
        aria-orientation="vertical"
        tabindex="0"
        aria-valuemin="290"
        aria-valuemax="900"
        aria-valuenow="400"
      ></div>
      <section class="document-panel">
        <div class="section-title">
          <div>文档 <span id="document-state" class="muted">未选择</span></div>
          <div class="toolbar">
            <button id="new" class="compact" type="button">新建</button>
            <button
              id="document-expand"
              class="compact"
              type="button"
              aria-pressed="false"
              title="放大文档面板"
            >
              放大
            </button>
          </div>
        </div>
        <details id="document-location" open>
          <summary>
            <span>文档定位</span
            ><span id="document-identity" class="muted"
              >按 id 与分区键读取</span
            >
          </summary>
          <div class="document-fields">
            <label
              >文档 id<input
                id="document-id"
                placeholder="文档 id"
                spellcheck="false" /></label
            ><label
              >完整分区键（JSON 数组）<span class="pk-input"
                ><input
                  id="document-pk"
                  placeholder='["tenant-a"] / [null] / [{}]'
                  spellcheck="false"
                /><button
                  id="document-pk-choose"
                  type="button"
                  aria-label="选择文档分区键"
                  aria-expanded="false"
                  aria-controls="pk-picker"
                >
                  选择 ▾
                </button></span
              ></label
            >
            <div class="toolbar">
              <button id="read">读取完整文档</button>
              <button id="generate-id" hidden>生成 UUID</button>
            </div>
            <small id="write-hint">连接后可查看文档操作权限。</small>
          </div>
        </details>
        <div class="document-view-toolbar">
          <div class="segmented" role="group" aria-label="文档视图">
            <button id="fields-view" type="button" aria-pressed="false">
              字段
            </button>
            <button
              id="document-json-view"
              type="button"
              class="active"
              aria-pressed="true"
            >
              JSON
            </button>
          </div>
          <div class="toolbar document-tools">
            <button
              id="document-search"
              type="button"
              class="icon-button"
              aria-label="搜索文档"
              title="搜索文档（⌘ / Ctrl + F）"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="10.5" cy="10.5" r="6.5" />
                <path d="m16 16 4.5 4.5" />
              </svg>
            </button>
            <div class="menu-anchor">
              <button
                id="document-more"
                type="button"
                class="icon-button"
                aria-label="JSON 更多操作"
                aria-haspopup="menu"
                aria-expanded="false"
                aria-controls="document-menu"
                title="JSON 更多操作"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="5" cy="12" r="1" />
                  <circle cx="12" cy="12" r="1" />
                  <circle cx="19" cy="12" r="1" />
                </svg>
              </button>
              <div id="document-menu" role="menu" aria-label="JSON 操作" hidden>
                <button id="document-format" type="button" role="menuitem">
                  格式化 JSON
                </button>
                <button
                  id="document-fold"
                  type="button"
                  role="menuitem"
                  title="收起嵌套对象与数组，保留顶层字段"
                >
                  折叠嵌套
                </button>
                <button id="document-unfold" type="button" role="menuitem">
                  展开所有层级
                </button>
              </div>
            </div>
          </div>
        </div>
        <button
          id="json-diagnostic"
          class="json-diagnostic"
          type="button"
          hidden
        ></button>
        <section id="field-editor" hidden aria-label="文档字段编辑">
          <input
            id="field-filter"
            type="search"
            aria-label="筛选文档字段"
            placeholder="按字段路径筛选…"
          />
          <div id="field-list"></div>
          <details id="add-field-section">
            <summary>添加字段</summary>
            <input
              id="add-field-path"
              aria-label="新字段路径"
              placeholder="/remark 或 /address/city"
            />
            <textarea
              id="add-field-value"
              aria-label="新字段值（JSON）"
              rows="2"
            >
""</textarea
            >
            <button id="add-field" type="button">添加到草稿</button>
          </details>
        </section>
        <div id="editor" class="code-editor"></div>
        <div class="document-footer">
          <label id="save-method-row" hidden
            >保存方式<select id="save-method" aria-label="保存方式">
              <option value="patch">局部更新（最多 10 个操作）</option>
              <option value="replace">完整替换文档</option>
            </select></label
          >
          <small id="etag">读取完整文档后才能更新或删除。</small>
          <div class="toolbar">
            <button id="save" class="primary">保存</button
            ><button id="delete" class="danger">删除</button>
          </div>
        </div>
      </section>
    </div>
    <section id="pk-picker" role="dialog" aria-label="分区键选择" hidden>
      <div class="section-title">
        <span id="pk-title">选择分区键</span
        ><button id="pk-close" type="button" aria-label="关闭分区键选择">
          ×
        </button>
      </div>
      <input
        id="pk-filter"
        type="search"
        aria-label="过滤分区键"
        placeholder="输入关键词查找分区键…"
        autocomplete="off"
      />
      <div id="pk-count" class="muted" aria-live="polite"></div>
      <div id="pk-options" role="listbox" aria-label="分区键候选"></div>
      <div class="pk-discovery">
        <div id="pk-progress" class="info" aria-live="polite">
          正在自动加载全部分区键…
        </div>
        <div class="toolbar">
          <button id="pk-load" type="button">暂停加载</button
          ><button id="pk-reload" type="button">刷新列表</button
          ><button id="pk-clear" type="button">清除选择</button>
        </div>
        <small
          >优先使用本地缓存；刷新列表才重新读取。关闭列表会停止续读。</small
        >
      </div>
    </section>
    <dialog id="confirm-dialog" tabindex="-1" aria-labelledby="confirm-title">
      <h3 id="confirm-title">确认操作</h3>
      <p id="confirm-message"></p>
      <div id="confirm-changes" hidden>
        <div id="change-count" class="info"></div>
        <div class="changes-scroll">
          <table aria-label="文档修改预览">
            <thead>
              <tr>
                <th>字段</th>
                <th>原值</th>
                <th>新值</th>
              </tr>
            </thead>
            <tbody id="change-rows"></tbody>
          </table>
        </div>
      </div>
      <div class="toolbar">
        <button id="confirm-cancel" type="button">取消</button
        ><button id="confirm-accept" type="button" class="primary">确认</button>
      </div>
    </dialog>
    <script type="module">
      /* SCRIPT */
    </script>
  </body>
</html>
