name: Release DBX plugin

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    uses: t8y2/dbx/.github/workflows/plugin-release-reusable.yml@dc57c632280b65ce15513f9564b5e42e163f507d
    with:
      release-tag: ${{ github.event.release.tag_name }}
      package-command: npm ci && npm run package
      package-path: dist/*.dbxp
      metadata-path: dist/*.artifact.json
      plugin-cli-version: 0.1.9
