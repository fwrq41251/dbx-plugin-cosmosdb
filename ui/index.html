<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cosmos DB NoSQL</title>
    <style>
      :root {
  color-scheme: light dark;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  --bg: #111718;
  --panel: #172022;
  --line: #2a3739;
  --text: #e0e9e8;
  --muted: #93a7a6;
  --accent: #86dfc9;
  --field: #111a1b;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
}
body.light {
  color-scheme: light;
  --bg: #f6f8f7;
  --panel: #fff;
  --line: #d9e3df;
  --text: #20322e;
  --muted: #647b72;
  --accent: #186f57;
  --field: #f8faf9;
}
header {
  height: 72px;
  padding: 16px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand strong {
  font-size: 17px;
  font-weight: 600;
}
.orbit {
  font-size: 34px;
  color: var(--accent);
}
small {
  display: block;
  color: var(--muted);
  font-size: 11px;
  margin-top: 4px;
}
.muted {
  color: var(--muted);
  font-weight: 400;
  font-size: 12px;
}
.badge {
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 5px 10px;
  font-size: 11px;
  color: var(--accent);
}
.workspace {
  display: grid;
  grid-template-columns: 210px minmax(320px, 1fr) 340px;
  height: calc(100vh - 72px);
  min-height: 500px;
}
aside {
  padding: 16px;
  border-right: 1px solid var(--line);
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 15px;
}
.section-title {
  min-height: 34px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-weight: 600;
}
.section-title button {
  font-weight: 400;
}
label {
  display: flex;
  flex-direction: column;
  gap: 7px;
  color: var(--muted);
  font-size: 11px;
}
button,
input,
select,
textarea {
  font: inherit;
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--field);
}
button {
  padding: 6px 10px;
  cursor: pointer;
  white-space: nowrap;
}
button:hover:not(:disabled),
button.active {
  border-color: var(--accent);
  color: var(--accent);
}
button.primary {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
  font-weight: 600;
}
button.danger {
  color: #f4a6a6;
}
button:disabled {
  opacity: 0.35;
  cursor: default;
}
input,
select {
  padding: 7px;
  width: 100%;
  min-width: 0;
}
textarea {
  resize: vertical;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px;
  line-height: 1.65;
  padding: 12px;
  tab-size: 2;
  outline: none;
}
textarea:focus,
input:focus,
select:focus,
button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
.info,
.aside-note {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}
.aside-note {
  margin-top: auto;
}
details {
  font-size: 11px;
  color: var(--muted);
}
summary {
  cursor: pointer;
  padding: 8px 0;
}
pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 10px;
  line-height: 1.6;
}
main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
}
.query-panel {
  padding: 12px 18px;
  border-bottom: 1px solid var(--line);
}
#sql {
  display: block;
  width: 100%;
  height: 130px;
  min-height: 70px;
}
#parameters {
  width: 100%;
  height: 70px;
}
.query-options {
  display: flex;
  align-items: end;
  gap: 10px;
  margin-top: 10px;
}
.query-options select {
  width: 72px;
}
.grow {
  flex: 1;
}
.toolbar {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
#status {
  min-height: 40px;
  padding: 12px 18px;
  color: var(--muted);
  font-size: 11px;
  border-bottom: 1px solid var(--line);
  overflow-wrap: anywhere;
}
#status.error {
  color: #edac9e;
  background: #be543412;
}
.results-panel {
  display: flex;
  flex: 1;
  min-height: 160px;
  flex-direction: column;
  overflow: hidden;
}
.results-panel > .section-title {
  padding: 10px 18px;
  flex-wrap: wrap;
}
.table-scroll {
  overflow: auto;
  flex: 1;
}
table {
  border-collapse: collapse;
  width: 100%;
  font-size: 12px;
}
th {
  position: sticky;
  top: 0;
  background: var(--panel);
  color: var(--muted);
  font-weight: 500;
  text-align: left;
}
th,
td {
  padding: 9px 12px;
  border-bottom: 1px solid var(--line);
  max-width: 260px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
tbody tr {
  cursor: pointer;
}
tbody tr:hover,
tbody tr.selected {
  background: #7cd4bf13;
}
td:first-child,
th:first-child {
  width: 36px;
  color: var(--muted);
}
.empty {
  display: grid;
  place-content: center;
  min-height: 170px;
  color: var(--muted);
}
#raw-results {
  flex: 1;
  resize: none;
  border: 0;
  border-top: 1px solid var(--line);
  border-radius: 0;
  width: 100%;
}
.document-panel {
  border-left: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
  background: var(--panel);
}
.document-panel > .section-title {
  padding: 12px 16px;
}
.document-fields {
  padding: 0 16px 12px;
  display: grid;
  gap: 10px;
}
#editor {
  flex: 1;
  min-height: 160px;
  border-radius: 0;
  border-left: 0;
  border-right: 0;
  resize: none;
  background: var(--field);
}
.document-footer {
  padding: 12px 16px;
  display: grid;
  gap: 12px;
}
.document-footer small {
  overflow-wrap: anywhere;
}
.document-footer .toolbar {
  justify-content: flex-end;
}
dialog {
  max-width: 430px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel);
  color: var(--text);
  padding: 24px;
  box-shadow: 0 24px 90px #0007;
}
dialog::backdrop {
  background: #0008;
}
dialog p {
  white-space: pre-wrap;
  line-height: 1.7;
}
dialog .toolbar {
  justify-content: flex-end;
  margin-top: 24px;
}
[hidden] {
  display: none !important;
}
@media (max-width: 1100px) {
  .workspace {
    grid-template-columns: 175px minmax(300px, 1fr) 290px;
  }
  .toolbar button {
    padding: 5px 7px;
  }
  .query-options {
    flex-wrap: wrap;
  }
  .query-options .grow {
    min-width: 150px;
  }
}
@media (max-width: 800px) {
  .workspace {
    grid-template-columns: 155px minmax(320px, 1fr);
    height: auto;
  }
  .document-panel {
    grid-column: 1/-1;
    min-height: 500px;
    border-top: 1px solid var(--line);
  }
  main {
    min-height: 550px;
  }
}

    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="orbit">◉</span>
        <div>
          <strong>Cosmos DB <span class="muted">/ NoSQL</span></strong
          ><small id="connection-name"
            >从 DBX 打开已保存的 Cosmos DB 连接</small
          >
        </div>
      </div>
      <span id="mode" class="badge">未连接</span>
    </header>
    <div class="workspace">
      <aside>
        <div class="section-title">
          数据库与容器 <button id="refresh" title="刷新数据库列表">↻</button>
        </div>
        <label
          >数据库<select id="database" aria-label="数据库">
            <option value="">选择数据库</option>
          </select></label
        ><label
          >容器<select id="container" aria-label="容器">
            <option value="">选择容器</option>
          </select></label
        >
        <div id="container-info" class="info">连接后选择容器开始查询。</div>
        <details>
          <summary>容器元数据</summary>
          <pre id="metadata">—</pre>
        </details>
        <div class="aside-note">
          查询按页读取。RU 与耗时为当前页；导出仅包含当前页。
        </div>
      </aside>
      <main>
        <section class="query-panel">
          <div class="section-title">
            SQL 查询 <span class="muted">⌘ / Ctrl + Enter</span>
          </div>
          <textarea id="sql" aria-label="SQL 查询" spellcheck="false">
SELECT * FROM c</textarea
          >
          <div class="query-options">
            <label
              >每页<select id="page-size">
                <option>25</option>
                <option selected>100</option>
                <option>250</option>
                <option>1000</option>
              </select></label
            ><label class="grow"
              >分区键（可选 JSON 数组）<input
                id="query-pk"
                placeholder='["tenant-a"] 或留空跨分区'
                spellcheck="false" /></label
            ><button id="run" class="primary">运行查询</button>
          </div>
          <details>
            <summary>查询参数</summary>
            <textarea
              id="parameters"
              aria-label="查询参数"
              spellcheck="false"
              placeholder='[{"name":"@id","value":"example"}]'
            >
[]</textarea
            >
          </details>
        </section>
        <div id="status" role="status" aria-live="polite">等待连接</div>
        <section class="results-panel">
          <div class="section-title">
            <div>查询结果 <span id="row-count" class="muted">0 条</span></div>
            <div class="toolbar">
              <button id="table-view" class="active">表格</button
              ><button id="json-view">JSON</button
              ><button id="export">导出当前页</button
              ><button id="previous">上一页</button
              ><span id="page-label">第 0 页</span
              ><button id="next">下一页</button>
            </div>
          </div>
          <div id="table" class="table-scroll">
            <div class="empty">选择容器后运行查询</div>
          </div>
          <textarea
            id="raw-results"
            aria-label="JSON 查询结果"
            readonly
            hidden
          ></textarea>
        </section>
      </main>
      <section class="document-panel">
        <div class="section-title">
          文档 <span id="document-state" class="muted">未选择</span>
        </div>
        <div class="document-fields">
          <label
            >文档 id<input
              id="document-id"
              placeholder="文档 id"
              spellcheck="false" /></label
          ><label
            >完整分区键（JSON 数组）<input
              id="document-pk"
              placeholder='["tenant-a"] / [null] / [{}]'
              spellcheck="false"
          /></label>
          <div class="toolbar">
            <button id="read">读取完整文档</button
            ><button id="new">新建</button>
          </div>
        </div>
        <textarea
          id="editor"
          aria-label="JSON 文档"
          spellcheck="false"
          readonly
          placeholder="点击结果行预览，再读取完整文档进行编辑"
        ></textarea>
        <div class="document-footer">
          <small id="etag">读取完整文档后才能更新或删除。</small>
          <div class="toolbar">
            <button id="save" class="primary">保存</button
            ><button id="delete" class="danger">删除</button>
          </div>
        </div>
      </section>
    </div>
    <dialog id="confirm-dialog" tabindex="-1" aria-labelledby="confirm-title">
      <h3 id="confirm-title">确认操作</h3>
      <p id="confirm-message"></p>
      <div class="toolbar">
        <button id="confirm-cancel" type="button">取消</button
        ><button id="confirm-accept" type="button" class="primary">确认</button>
      </div>
    </dialog>

      $("container-info").textContent = `${items.length} \u4E2A\u5BB9\u5668`;
      status("\u8BF7\u9009\u62E9\u5BB9\u5668");
    })
  );
  $("container").addEventListener(
    "change",
    () => action(async () => {
      const next = $("container").value;
      if (!await discard()) {
        $("container").value = state.container;
        return;
      }
      state.container = next;
      resetResults();
      const item = state.containers.find((x) => x.id === next);
      $("metadata").textContent = item ? stringify(item, null, 2) : "\u2014";
      $("container-info").textContent = item ? `\u5206\u533A\u8DEF\u5F84\uFF1A${(item.partitionKey?.paths || []).join(", ") || "\u65E0"}` : "\u9009\u62E9\u5BB9\u5668\u5F00\u59CB\u67E5\u8BE2";
      status("\u53EF\u4EE5\u8FD0\u884C\u67E5\u8BE2");
    })
  );
  bind("run", () => query());
  bind("next", () => query(true));
  bind("previous", async () => {
    if (await discard()) {
      state.page--;
      renderPage();
      resetEditor();
      metrics(state.pages[state.page]);
    }
  });
  bind("read", async () => {
    if (await discard()) {
      const identity = point();
      opened(await invoke("cosmos/read", identity), identity);
    }
  });
  bind("new", async () => {
    if (!await discard()) return;
    resetEditor();
    state.creating = true;
    state.baseline = '{\n  "id": ""\n}';
    $("editor").value = state.baseline;
    $("document-state").textContent = "\u65B0\u6587\u6863";
    $("etag").textContent = "\u586B\u5199 JSON\uFF08\u542B id\uFF09\u53CA\u5B8C\u6574\u5206\u533A\u952E\u540E\u4FDD\u5B58\u3002";
    status("\u6B63\u5728\u7F16\u8F91\u65B0\u6587\u6863");
  });
  bind("save", async () => {
    const text = $("editor").value;
    const doc = parse(text);
    if (!doc || Array.isArray(doc) || typeof doc.id !== "string" || !doc.id)
      throw new Error("\u6587\u6863\u5FC5\u987B\u662F\u5305\u542B\u5B57\u7B26\u4E32 id \u7684 JSON \u5BF9\u8C61");
    const creating = state.creating, identity = creating ? { ...scope(), id: doc.id, partitionKeyText: $("document-pk").value } : state.snapshot;
    parseArray(identity.partitionKeyText, "\u5206\u533A\u952E");
    if (!creating && (doc.id !== identity.id || $("document-pk").value !== identity.partitionKeyText || $("document-id").value !== identity.id))
      throw new Error("\u66F4\u65B0\u65F6\u4E0D\u80FD\u66F4\u6539 id \u6216\u5206\u533A\u952E\uFF0C\u8BF7\u91CD\u65B0\u8BFB\u53D6\u6587\u6863");
    if (!await confirmAction(
      creating ? "\u521B\u5EFA\u6587\u6863\uFF1F" : "\u66FF\u6362\u5B8C\u6574\u6587\u6863\uFF1F",
      `${identity.database} / ${identity.container}
id: ${identity.id}
\u5206\u533A\u952E: ${identity.partitionKeyText}`
    ))
      return;
    const result = await invoke(creating ? "cosmos/create" : "cosmos/replace", {
      ...identity,
      documentText: text
    });
    opened(result, identity);
    status("\u4FDD\u5B58\u6210\u529F\u3002\u67E5\u8BE2\u7ED3\u679C\u4E3A\u65E7\u5FEB\u7167\uFF0C\u53EF\u91CD\u65B0\u8FD0\u884C\u67E5\u8BE2\u5237\u65B0\u3002");
  });
  bind("delete", async () => {
    if (dirty()) throw new Error("\u5F53\u524D\u6709\u672A\u4FDD\u5B58\u4FEE\u6539\uFF0C\u8BF7\u5148\u4FDD\u5B58\u6216\u91CD\u65B0\u8BFB\u53D6\u6587\u6863");
    const identity = state.snapshot;
    if (!identity) throw new Error("\u8BF7\u5148\u8BFB\u53D6\u5B8C\u6574\u6587\u6863");
    if (!await confirmAction(
      "\u6C38\u4E45\u5220\u9664\u6587\u6863\uFF1F",
      `${identity.database} / ${identity.container}
id: ${identity.id}
\u5206\u533A\u952E: ${identity.partitionKeyText}
\u6B64\u64CD\u4F5C\u65E0\u6CD5\u64A4\u9500\u3002`
    ))
      return;
    const result = await invoke("cosmos/delete", identity);
    resetEditor();
    metrics(result, "\u5220\u9664\u6210\u529F\u3002\u91CD\u65B0\u8FD0\u884C\u67E5\u8BE2\u53EF\u5237\u65B0\u7ED3\u679C \xB7 ");
  });
  bind("export", async () => {
    const p = state.pages[state.page];
    const bytes = new TextEncoder().encode(p.json);
    if (bytes.length > 1024 * 1024)
      throw new Error("\u5F53\u524D\u9875\u8D85\u8FC7 1 MiB\uFF0C\u8BF7\u51CF\u5C0F\u6BCF\u9875\u6570\u91CF\u540E\u5BFC\u51FA");
    let binary = "";
    for (const byte of bytes) binary += String.fromCharCode(byte);
    const result = await host.request("host.saveFile", {
      fileName: `${state.container}-page-${state.page + 1}.json`,
      contentType: "application/json",
      dataBase64: btoa(binary)
    });
    status(result ? "\u5F53\u524D\u9875\u5DF2\u5BFC\u51FA" : "\u5DF2\u53D6\u6D88\u5BFC\u51FA");
  });
  $("table-view").onclick = () => view(false);
  $("json-view").onclick = () => view(true);
  $("editor").addEventListener("input", () => {
    $("document-state").textContent = dirty() ? "\u672A\u4FDD\u5B58" : state.creating ? "\u65B0\u6587\u6863" : "\u5B8C\u6574\u6587\u6863";
  });
  document.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
      e.preventDefault();
      if (!$("run").disabled) $("run").click();
    }
  });
  async function contextChanged(context) {
    const id = context?.connectionId || context?.connection?.id || "";
    if (id === state.connectionId) return;
    if ($("confirm-dialog").open) $("confirm-dialog").close("cancel");
    state.epoch++;
    state.connectionId = id;
    state.database = "";
    state.container = "";
    state.readOnly = true;
    resetResults();
    options("database", [], "\u9009\u62E9\u6570\u636E\u5E93");
    options("container", [], "\u9009\u62E9\u5BB9\u5668");
    $("connection-name").textContent = context?.connection?.name || context?.connectionName || context?.name || (id ? "\u5DF2\u8FDE\u63A5\u5230 Azure Cosmos DB" : "\u4ECE DBX \u6253\u5F00\u5DF2\u4FDD\u5B58\u7684 Cosmos DB \u8FDE\u63A5");
    if (!id) {
      $("mode").textContent = "\u672A\u8FDE\u63A5";
      status("\u8BF7\u4ECE DBX \u8FDE\u63A5\u5217\u8868\u6253\u5F00\u5DF2\u4FDD\u5B58\u7684 Cosmos DB \u8FDE\u63A5\u3002");
      controls();
      return;
    }
    state.busy = false;
    await action(async () => {
      const info = await invoke("cosmos/info");
      state.readOnly = info.readOnly;
      $("mode").textContent = info.readOnly ? "\u53EA\u8BFB\u8FDE\u63A5" : "\u5141\u8BB8\u6587\u6863\u5199\u5165";
      await loadDatabases();
    });
  }
  controls();
  if (host) {
    host.onContext(contextChanged);
    host.ready.then((context) => {
      const syncTheme = () => document.body.classList.toggle(
        "light",
        host.theme?.appearance === "light"
      );
      syncTheme();
      new MutationObserver(syncTheme).observe(document.documentElement, {
        attributes: true,
        attributeFilter: ["style", "class"]
      });
      return contextChanged(context || host.context);
    }).catch((e) => status(e.message, true));
  } else status("\u6B64\u5DE5\u4F5C\u53F0\u9700\u8981\u5728 DBX \u63D2\u4EF6\u5BBF\u4E3B\u4E2D\u6253\u5F00\u3002", true);
})();

    </script>
  </body>
</html>
